<text x="44" y="426" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">2. Model</text>
<rect x="44" y="438" width="560" height="116" rx="6" fill="#fff" stroke="#7b1e2b" stroke-width="2"/>
<rect x="44" y="438" width="5" height="116" fill="#7b1e2b"/>
<text x="60" y="460" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">GAT (final model)</text>
<text x="60" y="480" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">each cell is a node linked to its 8 neighbors: 52,573 nodes</text>
<text x="60" y="496" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">3 attention layers: each cell sees up to 4.5 km around it</text>
<text x="60" y="512" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">12 features per cell: 7 layers and 5 coverage flags</text>
<text x="60" y="528" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">final map: all mines, mean of 3 seeds</text>
<rect x="636" y="438" width="560" height="116" rx="6" fill="#fff" stroke="#7b1e2b" stroke-width="1.2"/>
<rect x="636" y="438" width="5" height="116" fill="#7b1e2b"/>
<text x="652" y="460" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">Benchmarks: LogReg and GAT bagging</text>
<text x="652" y="480" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">same mine capture in block validation</text>
<text x="652" y="496" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">LogReg scores each cell alone: fragmented targets</text>
<text x="652" y="512" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">LogReg generalizes somewhat better to a new trend</text>
<text x="652" y="528" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">GAT bagging costs 3 times more with no gain</text>
<rect x="24" y="590" width="1192" height="170" rx="12" fill="#fbf7f1" stroke="#7b1e2b" stroke-opacity="0.35"/>
<text x="44" y="616" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">3. Validation (each cell scored by a model that never saw its block)</text>
<rect x="44" y="628" width="360" height="116" rx="6" fill="#fff" stroke="#7b1e2b" stroke-width="2"/>
<rect x="44" y="628" width="5" height="116" fill="#7b1e2b"/>
<text x="60" y="650" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">22.5 km blocks</text>
<text x="60" y="670" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">AUC per fold: 0.924</text>
<text x="60" y="686" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">5%: 69% of mines, 85% of the gold</text>
<text x="60" y="702" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">10%: 78% of mines, 98% of the gold</text>
<text x="60" y="718" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">5% lift: 13.8 times random</text>
<rect x="440" y="628" width="360" height="116" rx="6" fill="#fff" stroke="#7b1e2b" stroke-width="2"/>
<rect x="440" y="628" width="5" height="116" fill="#7b1e2b"/>
<text x="456" y="650" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">Coherent targets (top 5%)</text>
<text x="456" y="670" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">47 patches, none a single stray cell</text>
<text x="456" y="686" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">LogReg: 128 patches, 23% stray cells</text>
<text x="456" y="702" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">mean area 126 km² (LogReg 46 km²)</text>
<text x="456" y="718" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">fewer, larger targets: workable programs</text>
<rect x="836" y="628" width="360" height="116" rx="6" fill="#fff" stroke="#7b1e2b" stroke-width="1.2"/>
<rect x="836" y="628" width="5" height="116" fill="#7b1e2b"/>
<text x="852" y="650" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">Ranking of exploration blocks</text>
<text x="852" y="670" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">10.5 km: AUC 0.834 (LogReg 0.816)</text>
<text x="852" y="686" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">15 km: AUC 0.818 (LogReg 0.796)</text>
<text x="852" y="702" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">better in all 3 seeds, at both sizes</text>
<text x="852" y="718" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">10.5 km Brier skill: 0.15</text>
<rect x="24" y="780" width="1192" height="150" rx="12" fill="#fbf7f1" stroke="#7b1e2b" stroke-opacity="0.35"/>
<text x="44" y="806" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">4. Products for target ranking</text>
<text x="1196" y="806" font-size="11" font-weight="normal" fill="#52606d" text-anchor="end">entregables/modelo_final</text>
<rect x="44" y="818" width="276" height="92" rx="6" fill="#fff" stroke="#7b1e2b" stroke-width="1.2"/>
<rect x="44" y="818" width="5" height="92" fill="#7b1e2b"/>
<text x="60" y="840" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">Favorability and percentile</text>
<text x="60" y="860" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">favorabilidad_GAT.tif (0 to 1)</text>
<text x="60" y="876" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">percentil_GAT.tif (0 to 100)</text>
<rect x="336" y="818" width="276" height="92" rx="6" fill="#fff" stroke="#7b1e2b" stroke-width="1.2"/>
<rect x="336" y="818" width="5" height="92" fill="#7b1e2b"/>
<text x="352" y="840" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">Top k% zones</text>
<text x="352" y="860" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">zonas_GAT.tif</text>
<text x="352" y="876" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">1 = 5%, 2 = 10%, 3 = 15%, 4 = 20%</text>
<rect x="628" y="818" width="276" height="92" rx="6" fill="#fff" stroke="#7b1e2b" stroke-width="1.2"/>
<rect x="628" y="818" width="5" height="92" fill="#7b1e2b"/>
<text x="644" y="840" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">Targets</text>
<text x="644" y="860" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">94 patches of the top 20%, 29 in the top 5%</text>
<text x="644" y="876" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">area, percentile, traffic light, mines, gold</text>
<rect x="920" y="818" width="276" height="92" rx="6" fill="#fff" stroke="#7b1e2b" stroke-width="1.2"/>
<rect x="920" y="818" width="5" height="92" fill="#7b1e2b"/>
<text x="936" y="840" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">Layer weights</text>
<text x="936" y="860" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">pesos_capas.csv</text>
<text x="936" y="876" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">GAT, GAT bagging and LogReg</text>
<text x="24" y="958" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">How to read the weights</text>
<text x="24" y="978" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">The weight is how much the model degrades when that layer is shuffled across cells: higher means the layer adds more that the others do not. The direction comes from the LogReg coefficient.</text>
<text x="24" y="994" font-size="10.5" font-weight="normal" fill="#3e4c59" text-anchor="start">LITO GEOQ weighs little by permutation, yet adding it raised the mines in the top 5% from 62 to 69%: its value is at the top of the ranking.</text>
